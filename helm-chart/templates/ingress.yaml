apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamingapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-svc
                port:
                  number: 80
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-svc
                port:
                  number: {{ .Values.services.auth.port }}
          - path: /api/streaming(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: streaming-svc
                port:
                  number: {{ .Values.services.streaming.port }}
          - path: /api/admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: admin-svc
                port:
                  number: {{ .Values.services.admin.port }}
          - path: /api/chat(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: chat-svc
                port:
                  number: {{ .Values.services.chat.port }}
