services:
  auth:
    image: hellraiserone/streaming-auth
    tag: "1.0.0"
    replicas: 2
    port: 3001
  streaming:
    image: hellraiserone/streaming-stream
    tag: "1.0.0"
    replicas: 2
    port: 3002
  admin:
    image: hellraiserone/streaming-admin
    tag: "1.0.0"
    replicas: 2
    port: 3003
  chat:
    image: hellraiserone/streaming-chat
    tag: "1.0.0"
    replicas: 2
    port: 3004
  frontend:
    image: hellraiserone/streaming-frontend
    tag: "1.0.0"
    replicas: 2
    port: 80

# mongo.storageSize is unused now that the app connects to MongoDB Atlas
# instead of an in-cluster StatefulSet — kept here in case you switch back.
mongo:
  storageSize: 5Gi

ingress:
  host: streamingapp.local

config:
  clientUrls: "http://streamingapp.local"
  awsRegion: "us-east-1"

# Do NOT commit real values here — pass these at install time with --set
# e.g. helm install streamingapp ./streamingapp --set secrets.jwtSecret=... etc.
secrets:
  jwtSecret: "changeme"
  awsAccessKeyId: "changeme"
  awsSecretAccessKey: "changeme"
  # Full MongoDB Atlas SRV connection string, credentials included:
  # mongodb+srv://<user>:<password>@<cluster>.mongodb.net/streamingapp?retryWrites=true&w=majority
  mongoUri: "changeme"
